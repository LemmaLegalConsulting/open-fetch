# Deploy as a DIFFERENT Fly app from the classification API.
[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"
[env]
  PORT = "8080"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
